<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>evcc-card test harness</title>
  <style>
    /* HA default theme tokens (light) and the dark theme overrides, as the frontend sets them. */
    :root {
      --primary-color: #03a9f4; --primary-text-color: #212121; --secondary-text-color: #727272;
      --primary-background-color: #fafafa; --card-background-color: #fff;
      --divider-color: rgba(0, 0, 0, .12); --secondary-background-color: #e5e5e5;
      --ha-card-border-radius: 12px; --ha-card-box-shadow: none; --ha-card-border-width: 1px;
      /* --ha-card-background / --ha-card-border-color are left undefined on purpose: a var()
         alias declared on :root would resolve there (light values) and ignore body.dark. */
    }
    body.dark {
      --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
      --primary-background-color: #111111; --card-background-color: #1c1c1c;
      --divider-color: rgba(225, 225, 225, .12); --secondary-background-color: #202020;
    }
    body { margin: 0; padding: 16px; background: var(--primary-background-color); font-family: Roboto, "Segoe UI", sans-serif; color: var(--primary-text-color); }
    #host { width: var(--w, 400px); }
  </style>
</head>
<body>
  <div id="host"></div>
  <script>
    // Idle signal for the suite (window.__settle): the card has settled when no
    // short timer is pending (render debounce, the mock's service echo, preview
    // debounces), no fetch is open and its shadow DOM has not changed for 50 ms.
    // Timers above a second are left out: they are expiries (a written value's
    // mark, a highlight) that a test waits for on purpose, not work in flight.
    // Wrapped before the card loads, so every timer it sets is seen; the clock
    // Playwright installs keeps timers native, only Date is frozen.
    (() => {
      const nativeSet = window.setTimeout, nativeClear = window.clearTimeout, nativeFetch = window.fetch;
      const pending = new Set();
      let fetches = 0;
      window.setTimeout = function (fn, ms = 0, ...args) {
        const id = nativeSet(function () {
          pending.delete(id);
          return typeof fn === "function" ? fn.apply(this, args) : (0, eval)(fn);
        }, ms);
        if (ms <= 1000) pending.add(id);
        return id;
      };
      window.clearTimeout = (id) => { pending.delete(id); nativeClear(id); };
      window.fetch = (...a) => { fetches++; return nativeFetch(...a).finally(() => { fetches--; }); };
      window.__mutations = 0;
      window.__idle = () => !!window.__ready?.() && pending.size === 0 && fetches === 0;
      window.__settle = async (maxMs = 8000) => {
        for (let waited = 0; waited < maxMs; waited += 50) {
          const seen = window.__mutations;
          await new Promise(r => nativeSet(r, 50));
          if (window.__idle() && seen === window.__mutations) return true;
        }
        return false;
      };
    })();
  </script>
  <script type="module">
    import { createMockHass } from "./mock-hass.js";

    // The card renders into an <ha-card>, which HA defines. Outside HA it is an
    // unknown (transparent) element, so provide the essentials of HA's ha-card:
    // background, border, radius and shadow from the theme tokens above.
    if (!customElements.get("ha-card")) {
      customElements.define("ha-card", class extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: "open" }).innerHTML = `<style>
            :host { display: block; position: relative; box-sizing: border-box; color: var(--primary-text-color);
                    background: var(--ha-card-background, var(--card-background-color, white));
                    border-radius: var(--ha-card-border-radius, 12px); box-shadow: var(--ha-card-box-shadow, none);
                    border-width: var(--ha-card-border-width, 1px); border-style: solid;
                    border-color: var(--ha-card-border-color, var(--divider-color, #e0e0e0)); }
          </style><slot></slot>`;
        }
      });
    }

    // HA's form, stood in for by an element that keeps its contract: `schema`,
    // `data`, `computeLabel`, `computeHelper` in, a `value-changed` event with
    // the whole data on every change out. It draws one native field per schema
    // entry, marked with data-name (a field of a named section as
    // "section.key", one of a flattened section by its key alone), and keeps the fields when only the data changes, as HA's
    // form does. A multiple select appends a checked value, like HA's list.
    if (!customElements.get("ha-form")) {
      customElements.define("ha-form", class extends HTMLElement {
        set schema(v) { const key = JSON.stringify(v); this._schema = v; if (key !== this._schemaKey) { this._schemaKey = key; this._build(); } }
        get schema() { return this._schema; }
        set data(v) { this._data = v || {}; this._sync(); }
        get data() { return this._data || {}; }
        set computeLabel(f) { this._computeLabel = f; this._texts(); }
        get computeLabel() { return this._computeLabel; }
        set computeHelper(f) { this._computeHelper = f; this._texts(); }
        get computeHelper() { return this._computeHelper; }
        _get(path) { return path.reduce((o, k) => (o == null ? undefined : o[k]), this.data); }
        _emit(path, value) {
          const data = { ...this.data };
          if (path.length === 2) data[path[0]] = { ...(data[path[0]] || {}), [path[1]]: value };
          else data[path[0]] = value;
          this.dispatchEvent(new CustomEvent("value-changed", { detail: { value: data } }));
        }
        _build() {
          // HA's form keeps a panel open when only the schema around it changes
          // (a section title that counts its set fields), so the stand-in does too.
          const open = new Set([...this.querySelectorAll("details[open]")].map(d => d.dataset.section));
          this.replaceChildren();
          this._fields = [];
          const walk = (schema, parent, path) => {
            for (const s of schema || []) {
              if (s.type === "expandable") {
                const box = document.createElement("details");
                box.dataset.section = s.name;
                box.open = open.has(s.name);
                const head = document.createElement("summary");
                head.textContent = s.title || "";
                box.append(head);
                parent.append(box);
                walk(s.schema, box, s.flatten ? path : [...path, s.name]);
                continue;
              }
              const p = [...path, s.name];
              const name = p.join(".");
              const wrap = document.createElement("div");
              wrap.dataset.field = name;
              const label = document.createElement("label");
              label.dataset.labelFor = name;
              const helper = document.createElement("div");
              helper.dataset.helperFor = name;
              const sel = s.selector || {};
              wrap.append(label);
              if (sel.select && sel.select.multiple) {
                for (const o of sel.select.options) {
                  const row = document.createElement("label");
                  const cb = document.createElement("input");
                  cb.type = "checkbox"; cb.dataset.name = name; cb.value = o.value;
                  cb.addEventListener("change", () => {
                    const cur = this._get(p) || [];
                    this._emit(p, cb.checked ? [...cur.filter(v => v !== o.value), o.value] : cur.filter(v => v !== o.value));
                  });
                  row.append(cb, document.createTextNode(o.label));
                  wrap.append(row);
                }
              } else if (sel.select) {
                const el = document.createElement("select");
                el.dataset.name = name;
                for (const o of sel.select.options) el.append(new Option(o.label, o.value));
                el.addEventListener("change", () => this._emit(p, el.value));
                wrap.append(el);
              } else if (sel.boolean) {
                const el = document.createElement("input");
                el.type = "checkbox"; el.dataset.name = name;
                el.addEventListener("change", () => this._emit(p, el.checked));
                wrap.append(el);
              } else if (sel.number) {
                const el = document.createElement("input");
                el.type = "number"; el.dataset.name = name;
                // HA's number field reports while typing, not on change.
                el.addEventListener("input", () => this._emit(p, el.value === "" ? undefined : Number(el.value)));
                wrap.append(el);
              } else {
                const el = document.createElement("input");
                el.type = "text"; el.dataset.name = name;
                el.addEventListener("input", () => this._emit(p, el.value));
                wrap.append(el);
              }
              wrap.append(helper);
              parent.append(wrap);
              this._fields.push({ s, p, name });
            }
          };
          walk(this._schema, this, []);
          this._texts();
          this._sync();
        }
        _texts() {
          for (const f of this._fields || []) {
            const label = this.querySelector(`[data-label-for="${f.name}"]`);
            const helper = this.querySelector(`[data-helper-for="${f.name}"]`);
            if (label) label.textContent = this._computeLabel ? (this._computeLabel(f.s) ?? f.s.name) : f.s.name;
            if (helper) helper.textContent = (this._computeHelper && this._computeHelper(f.s)) || "";
          }
        }
        _sync() {
          for (const f of this._fields || []) {
            const v = this._get(f.p);
            const els = [...this.querySelectorAll(`[data-name="${f.name}"]`)];
            if (f.s.selector?.select?.multiple) els.forEach(cb => { cb.checked = (v || []).includes(cb.value); });
            else if (f.s.selector?.boolean) els[0].checked = !!v;
            else { const want = v === undefined || v === null ? "" : String(v); if (els[0].value !== want) els[0].value = want; }
          }
        }
      });
    }

    import("../dist/evcc-card.js");

    const q      = new URLSearchParams(location.search);
    const config = q.get("config") ? JSON.parse(q.get("config")) : { mode: q.get("mode") || "loadpoint" };
    if (q.get("dark")) document.body.classList.add("dark");
    if (q.get("w"))    document.getElementById("host").style.setProperty("--w", `${q.get("w")}px`);

    // Fixture variants via query: set=entity:state,... disable=entity,... rename=from:to
    // tariff=co2, and attrs as JSON because attribute values may contain any character.
    // split at the first colon only: a value may be an ISO time. An entry
    // without one is a broken test call; it is skipped with a console error,
    // which the suite counts, rather than setting a truncated entity.
    const set = Object.fromEntries((q.get("set") || "").split(",").filter(Boolean).flatMap(kv => {
      const i = kv.indexOf(":");
      if (i < 0) { console.error(`harness: set entry without a colon: ${kv}`); return []; }
      return [[kv.slice(0, i), kv.slice(i + 1)]];
    }));
    const attrs = q.get("attrs") ? JSON.parse(q.get("attrs")) : {};
    const disable = (q.get("disable") || "").split(",").filter(Boolean);
    const rename = q.get("rename") ? (([from, to]) => ({ from, to }))(q.get("rename").split(":")) : null;
    const second = q.get("second") ? JSON.parse(q.get("second")) : null;
    const hass = await createMockHass({ language: q.get("lang") || "de", ws: q.get("ws") !== "0", admin: q.get("admin") !== "0", drop: (q.get("drop") || "").split(",").filter(Boolean),
                                        set, attrs, disable, rename, tariff: q.get("tariff") || "price", second,
                                        wsName: q.get("wsname"), vehicleDevice: q.get("vd") !== "0", optimizer: q.get("optimizer") === "1", batteryExt: q.get("battext") === "1", optimize: q.get("optimize") === "1" });
    await customElements.whenDefined("evcc-card");
    const card = document.createElement("evcc-card");
    new MutationObserver(() => { window.__mutations++; })
      .observe(card.shadowRoot, { subtree: true, childList: true, attributes: true, characterData: true });
    card.setConfig(config);
    card.hass = hass;
    document.getElementById("host").appendChild(card);

    // Mirror HA: every state change arrives as a new hass object.
    window.addEventListener("mock-hass-updated", () => { card.hass = { ...hass, states: hass.states }; });

    window.__card  = card;
    window.__hass  = hass;
    window.__ready = () => !!card.shadowRoot?.querySelector("ha-card") && card._translationsReady === true;
  </script>
</body>
</html>
